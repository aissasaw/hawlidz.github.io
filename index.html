<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="الموقع الرسمي والمتجر الموسيقي - استمع وحمّل أحدث الأغاني بصيغة MP3 والفيديوهات الموسيقية الحصرية.">
    <title>فارس عبدلي  | الموقع الرسمي والمتجر الموسيقي</title>
    <style>
        /* المتغيرات والألوان الداكنة بأسلوب المنصات العالمية */
        :root {
            --bg-dark: #09090b;
            --bg-card: #18181b;
            --bg-card-hover: #27272a;
            --accent-gold: #eab308;
            --accent-gold-hover: #ca8a04;
            --text-light: #fafafa;
            --text-gray: #a1a1aa;
            --border-dark: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* شريط التنقل الشفاف فوق الخلفية */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
        }

        .brand-logo {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text-light);
            text-decoration: none;
            text-transform: uppercase;
        }

        .brand-logo span {
            color: var(--accent-gold);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-menu a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-menu a:hover,
        .nav-menu a:focus {
            color: var(--accent-gold);
        }

        /* القسم الافتتاحي بصورة خلفية كبيرة (Hero Banner) */
        .hero-banner {
            height: 95vh;
            min-height: 600px;
            background: linear-gradient(to bottom, rgba(9, 9, 11, 0.3) 0%, rgba(9, 9, 11, 0.75) 70%, var(--bg-dark) 100%),
                        url('artist-bg.jpg') center/cover no-repeat;
            display: flex;
            align-items: flex-end;
            padding-bottom: 80px;
            text-align: right;
        }

        .hero-content {
            max-width: 700px;
        }

        .hero-badge {
            display: inline-block;
            background-color: var(--accent-gold);
            color: #000000;
            font-weight: 800;
            font-size: 0.8rem;
            padding: 5px 14px;
            border-radius: 50px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 15px;
        }

        .hero-content p {
            font-size: 1.2rem;
            color: #d4d4d8;
            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-gold {
            background-color: var(--accent-gold);
            color: #000000;
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: 800;
            text-decoration: none;
            transition: background-color 0.3s, transform 0.2s;
            display: inline-block;
        }

        .btn-gold:hover {
            background-color: var(--accent-gold-hover);
            transform: translateY(-2px);
        }

        .btn-outline {
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: var(--text-light);
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            transition: border-color 0.3s, background-color 0.3s;
            display: inline-block;
        }

        .btn-outline:hover {
            border-color: var(--text-light);
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* تنسيق الأقسام العامة */
        section {
            padding: 70px 0;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-dark);
            padding-bottom: 15px;
        }

        .section-header h2 {
            font-size: 2rem;
            font-weight: 800;
        }

        /* متجر الأغاني MP3 */
        .mp3-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .track-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            transition: background-color 0.3s;
        }

        .track-item:hover {
            background-color: var(--bg-card-hover);
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 240px;
        }

        .track-cover {
            width: 65px;
            height: 65px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #27272a;
        }

        .track-title {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .track-meta {
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .track-player {
            flex-grow: 1;
            max-width: 400px;
        }

        audio {
            width: 100%;
            height: 40px;
            border-radius: 8px;
        }

        .track-action {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .price-tag {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-gold);
        }

        .btn-buy {
            background-color: var(--accent-gold);
            color: #000000;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-buy:hover {
            background-color: var(--accent-gold-hover);
        }

        /* متجر ومعرض الفيديوهات الموسيقية */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .video-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            background-color: #000000;
        }

        .video-wrapper video {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .video-details {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .video-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .video-desc {
            font-size: 0.9rem;
            color: var(--text-gray);
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .video-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-dark);
            padding-top: 15px;
        }

        /* التذييل (Footer) */
        footer {
            background-color: #050507;
            border-top: 1px solid var(--border-dark);
            padding: 50px 0 30px;
            margin-top: 60px;
            color: var(--text-gray);
        }

        .footer-top {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 30px;
        }

        .footer-links {
            display: flex;
            list-style: none;
            gap: 20px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .footer-links a:hover {
            color: var(--accent-gold);
        }

        .footer-bottom {
            text-align: center;
            font-size: 0.85rem;
            border-top: 1px solid var(--border-dark);
            padding-top: 20px;
        }

                flex-direction: column;
                height: auto;
                padding: 15px 0;
                gap: 10px;
            }
            .hero-content h1 {
                font-size: 2.3rem;
