<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="فارس عبدلي | الموقع الرسمي والمتجر الموسيقي - استمع وحمّل أحدث الأغاني بصيغة MP3 والفيديوهات.">
    <title>فارس عبدلي | الموقع الرسمي والمتجر الموسيقي</title>
    <style>
        :root {
            --bg-dark: #09090b;
            --bg-card: #18181b;
            --bg-card-hover: #27272a;
            --accent-gold: #eab308;
            --accent-gold-hover: #ca8a04;
            --text-light: #fafafa;
            --text-gray: #a1a1aa;
            --border-dark: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(9, 9, 11, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-light);
            text-decoration: none;
        }

        .brand-logo span {
            color: var(--accent-gold);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-menu a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .nav-menu a:hover {
            color: var(--accent-gold);
        }

                .hero-banner {
            min-height: 85vh;
            background: linear-gradient(to bottom, rgba(9, 9, 11, 0.4) 0%, rgba(9, 9, 11, 0.85) 75%, var(--bg-dark) 100%),
                        url('artist-bg.jpg') center/cover no-repeat;
            display: flex;
            align-items: flex-end;
            padding-top: 120px;
            padding-bottom: 60px;
        }
;
        }

        .hero-content {
            max-width: 700px;
        }

        .hero-badge {
            display: inline-block;
            background-color: var(--accent-gold);
            color: #000000;
            font-weight: 800;
            font-size: 0.8rem;
            padding: 5px 14px;
            border-radius: 50px;
            margin-bottom: 15px;
        }

        .hero-content h1 {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        .hero-content p {
            font-size: 1.1rem;
            color: #d4d4d8;
            margin-bottom: 25px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-gold {
            background-color: var(--accent-gold);
            color: #000000;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 800;
            text-decoration: none;
            display: inline-block;
        }

        .btn-outline {
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: var(--text-light);
            padding: 10px 26px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
        }

        section {
            padding: 50px 0;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-dark);
            padding-bottom: 15px;
        }

        .section-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .mp3-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .track-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .track-cover {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #27272a;
        }

        .track-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .track-meta {
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .track-player {
            flex-grow: 1;
            max-width: 350px;
            width: 100%;
        }

        audio {
            width: 100%;
            height: 40px;
        }

        .track-action {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .price-tag {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-gold);
        }

        .btn-buy {
            background-color: var(--accent-gold);
            color: #000000;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 20px;
        }

        .video-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .video-wrapper video {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #000000;
        }

        .video-details {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .video-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .video-desc {
            font-size: 0.9rem;
            color: var(--text-gray);
            margin-bottom: 18px;
            flex-grow: 1;
        }

        .video-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-dark);
            padding-top: 12px;
        }

        footer {
            background-color: #050507;
            border-top: 1px solid var(--border-dark);
            padding: 40px 0 25px;
            margin-top: 50px;
            color: var(--text-gray);
        }

        .footer-top {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
        }

        .footer-links {
            display: flex;
            list-style: none;
            gap: 15px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .footer-bottom {
            text-align: center;
            font-size: 0.85rem;
            border-top: 1px solid var(--border-dark);
            padding-top: 15px;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                height: auto;
                padding: 12px 0;
                gap: 8px;
            }
            .hero-content h1 {
                font-size: 2rem;
            }
            .track-action {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>

                    <li><a href="contact.html">تواصل</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero-banner" id="home" aria-labelledby="main-title">
        <div class="container">
            <div class="hero-content">
                <span class="hero-badge">إصدار حصري جديد</span>
                <h1 id="main-title">فارس عبدلي | الموقع الرسمي والمتجر الموسيقي</h1>
                <p>استمع وحمّل أحدث الأعمال الغنائية بجودة استوديو أصلية MP3، وشاهد الفيديو كليبات الحصرية مباشرة.</p>
                <div class="hero-buttons">
                    <a href="#mp3-store" class="btn-gold">تصفح متجر MP3</a>
                    <a href="#video-store" class="btn-outline">شاهد الفيديوهات</a>
                </div>
            </div>
        </div>
    </section>
